info:
  name: Listar Productos Paginados y Filtrados
  type: http
  seq: 3

http:
  method: GET
  url: http://localhost:3000/api/products?gender=men&brand=Adidas&sortBy=price_asc&page=1&limit=5
  params:
    - name: gender
      value: men
      type: query
    - name: brand
      value: Adidas
      type: query
    - name: sortBy
      value: price_asc
      type: query
    - name: page
      value: "1"
      type: query
    - name: limit
      value: "5"
      type: query
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
